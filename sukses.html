<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran Berhasil - Ma'had Al-Bashiroh</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <style>
        body {
            background-color: #f0fdf4;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #1f2937;
        }
        .card {
            background: #ffffff;
            padding: 2.5rem 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .icon-success {
            font-size: 3.5rem;
            color: #059669;
            margin-bottom: 1rem;
        }
        h2 {
            color: #059669;
            margin-bottom: 0.5rem;
        }
        p {
            color: #6b7280;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }
        .btn {
            background-color: #059669;
            color: white;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            display: inline-block;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
        }
        .btn:hover {
            background-color: #047857;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-success">✅</div>
        <h2>Pembayaran Berhasil!</h2>
        <p>Terima kasih, pembayaran uang saku santri telah berhasil diproses. Saldo akan segera diperbarui ke sistem.</p>
        <a href="index.html" class="btn">Kembali ke Portal</a>
    </div>
</body>
</html>
